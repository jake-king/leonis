name: p5

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: probes/p5-android
    steps:
      - uses: actions/checkout@v4
      - name: Rust Android targets
        run: rustup target add x86_64-linux-android aarch64-linux-android
      - name: Android SDK packages (same versions as the dev box)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" "emulator" "platforms;android-36" "build-tools;36.1.0" \
            "ndk;29.0.14206865" "system-images;android-36;google_apis;x86_64" >/dev/null
      - name: Build APKs (arm64 for devices, x86_64 for the emulator)
        run: |
          ./build-apk.sh arm64-v8a
          ./build-apk.sh x86_64
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot the emulator (SwiftShader, no window)
        run: |
          # avdmanager and the emulator must agree on where AVDs live; the runner's defaults do not.
          export ANDROID_AVD_HOME="$RUNNER_TEMP/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          "$ANDROID_HOME/emulator/emulator" -accel-check
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n leonis-api36 \
            -k "system-images;android-36;google_apis;x86_64" -d pixel_7 --force
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -qx leonis-api36 \
            || { echo "AVD not visible to the emulator"; ls -la "$ANDROID_AVD_HOME"; exit 1; }
          log="$RUNNER_TEMP/emulator.log"
          nohup "$ANDROID_HOME/emulator/emulator" -avd leonis-api36 -no-window -gpu swiftshader_indirect \
            -no-snapshot -no-audio -no-boot-anim -memory 3072 > "$log" 2>&1 &
          emu=$!
          adb="$ANDROID_HOME/platform-tools/adb"
          "$adb" start-server
          # Poll instead of `adb wait-for-device`, so a dead emulator fails fast and its log is shown.
          for i in $(seq 1 120); do
            if ! kill -0 "$emu" 2>/dev/null; then
              echo "emulator exited after ~$((i * 5)) s"; tail -80 "$log"; exit 1
            fi
            if [ "$("$adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then
              echo "booted after ~$((i * 5)) s"; exit 0
            fi
            sleep 5
          done
          echo "emulator did not finish booting in 600 s"; "$adb" devices; tail -80 "$log"; exit 1
      - name: Run P5 and its negative control
        run: ./run-on-device.sh build/x86_64/p5.apk p5-android-emulator.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p5-android
          path: probes/p5-android/p5-android-emulator.png
          if-no-files-found: ignore
