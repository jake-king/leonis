name: probes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p1:
    name: p1 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: probes/p1-sdl3-wgpu
    steps:
      - uses: actions/checkout@v4
      - name: Linux packages (SDL3 build deps, Xvfb, lavapipe)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q cmake ninja-build xvfb mesa-vulkan-drivers \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev \
            libxfixes-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols \
            libegl1-mesa-dev libgl1-mesa-dev libdrm-dev libgbm-dev libdecor-0-dev
      - name: Build
        run: cargo build --locked --features vendored
      - name: Run P1 and its negative control
        run: |
          bin=target/debug/p1-sdl3-wgpu
          if [ "$RUNNER_OS" = Linux ]; then
            export SDL_VIDEO_DRIVER=x11
            run() { xvfb-run -a -s '-screen 0 1280x800x24' "$bin" "$@"; }
          else
            run() { "$bin" "$@"; }
          fi
          set +e
          run; rc=$?
          run --plant-wrong-colour; control=$?
          set -e
          echo "probe exit=$rc control exit=$control"
          [ "$rc" -eq 0 ] && [ "$control" -eq 1 ]
