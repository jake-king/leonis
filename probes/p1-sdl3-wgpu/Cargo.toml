[package]
name = "p1-sdl3-wgpu"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
sdl3 = { version = "0.22.1", features = ["raw-window-handle"] }
wgpu = "30.0.2"
pollster = "0.4"

[features]
# CI: build SDL3 from source and link it statically (no system SDL3 package needed).
vendored = ["sdl3/build-from-source-static"]

[workspace]
